<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="NovaTech shopping cart - Review your selected products."
    />

    <title>NovaTech | Shopping Cart</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Header -->
    <header class="header">
      <nav class="navbar container">
        <a href="index.html" class="logo"> Nova<span>Tech</span> </a>

        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="index.html#products">Products</a></li>
          <li><a href="index.html#about">About</a></li>
          <li><a href="index.html#contact">Contact</a></li>
        </ul>

        <div class="nav-actions">
          <a href="cart.html" class="cart-button cart-link">
            🛒
            <span class="cart-count">0</span>
          </a>
        </div>
      </nav>
    </header>

    <main>
      <!-- Cart Page -->
      <section class="cart-page">
        <div class="container">
          <div class="cart-page-heading">
            <p class="section-label">YOUR BAG</p>

            <h1>Shopping Cart</h1>

            <p>Review your selected products before continuing to checkout.</p>
          </div>

          <div class="cart-page-layout">
            <!-- Cart Items -->
            <div class="cart-page-items">
              <!-- Cart items will be rendered with JavaScript -->
            </div>

            <!-- Cart Summary -->
            <aside class="cart-summary">
              <p class="cart-summary-label">ORDER SUMMARY</p>

              <h2>Summary</h2>

              <div class="summary-row">
                <span>Subtotal</span>
                <strong class="cart-page-subtotal">$0</strong>
              </div>

              <div class="summary-row">
                <span>Shipping</span>
                <strong>Free</strong>
              </div>

              <div class="summary-divider"></div>

              <div class="summary-total">
                <span>Total</span>
                <strong class="cart-page-total">$0</strong>
              </div>

              <button class="checkout-button cart-checkout-button">
                Continue to Checkout
              </button>

              <a href="index.html#products" class="continue-shopping">
                ← Continue Shopping
              </a>
            </aside>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="container">
        <p>© 2026 NovaTech. All rights reserved.</p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
